org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Fixtures signees (voir docs/CONTRAT_FIXTURES.md).
# Calendrier publie par .github/workflows/publish.yml. Surchargeable dans android/local.properties
# ou via -PFIXTURES_BASE_URL=... -PFIXTURES_PUBLIC_KEYS=... en CI.
# La cle publique Ed25519 n'est pas un secret, mais elle doit correspondre a FIXTURES_SIGNING_KEY.
FIXTURES_BASE_URL=https://davidjahan720.github.io/football-rama/
# Liste de cles publiques base64 separees par des virgules (rotation de cle).
FIXTURES_PUBLIC_KEYS=JXmB2qbthIht0IOhIq5qf+VMygJlHBk8OSkkz3dAA3A=

# Version de l'app : source unique (app/build.gradle.kts, scripts/publish_release.ps1).
# A chaque release : incrementer APP_VERSION_CODE (entier strictement croissant) et APP_VERSION_NAME (x.y.z).
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0.0
